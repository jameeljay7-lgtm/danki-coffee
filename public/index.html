<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Danki Coffee — Liquid Glass</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:FILL@0;1&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#ffc68b',
            'on-primary': '#492900',
            'amber-glow': '#ffbf69',
            'espresso-deep': '#0c0705',
            'on-surface': '#ffffff',
            'on-surface-variant': '#a3a3a3'
          },
          fontFamily: {
            display: ['Sora', 'sans-serif'],
            body: ['Manrope', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: #000000;
      color: #ffffff;
      font-family: Manrope, sans-serif;
      overflow-x: hidden;
    }
    
    /* Liquid Background */
    .mesh-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: radial-gradient(circle at 50% 0%, #1a1005 0%, #000000 60%);
    }
    .liquid-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      mix-blend-mode: screen;
      opacity: 0.4;
      animation: drift 15s infinite alternate ease-in-out;
    }
    .orb-1 { width: 400px; height: 400px; background: #995511; top: -100px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: #cc7722; bottom: -50px; right: -50px; animation-delay: -5s; }
    
    @keyframes drift {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 50px) scale(1.2); }
    }

    /* Glassmorphism */
    .glass {
      background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.05);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
    }
    
    /* Product card hover effect */
    .glass.product-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: rgba(230, 172, 0, 0.3);
      box-shadow: 0 16px 40px 0 rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(230, 172, 0, 0.05);
    }
    .glass.product-card:hover .product-img {
      transform: scale(1.05);
    }
    .product-img {
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    
    .glass-strong {
      background: rgba(15, 15, 15, 0.7);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }

    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { scrollbar-width: none; }

    .product-img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
    }

    .safe-bottom { padding-bottom: max(90px, calc(90px + env(safe-area-inset-bottom))); }
  </style>
</head>
<body class="min-h-screen safe-bottom text-sm md:text-base">

  <div class="mesh-bg">
    <div class="liquid-orb orb-1"></div>
    <div class="liquid-orb orb-2"></div>
  </div>

  <!-- Floating Nav (Mobile) -->
  <header class="fixed top-4 inset-x-4 z-40 md:hidden flex items-center justify-between glass-strong rounded-full px-5 py-3">
    <span class="font-display text-lg font-bold text-primary">Danki</span>
    <div class="flex items-center gap-3">
      <button class="p-1"><span class="material-symbols-outlined text-white">search</span></button>
      <button class="p-1"><span class="material-symbols-outlined text-white">person</span></button>
    </div>
  </header>

  <!-- Desktop Nav -->
  <header class="hidden md:flex fixed top-0 inset-x-0 z-40 glass-strong h-20 items-center px-10 justify-between border-b-0 border-white/10">
    <span class="font-display text-2xl font-bold text-primary">Danki Coffee</span>
    <nav class="flex gap-8 font-medium">
      <a href="#home" class="hover:text-primary transition">Home</a>
      <a href="#shop" class="hover:text-primary transition">Shop</a>
      <a href="#story" class="hover:text-primary transition">Story</a>
    </nav>
    <button onclick="openCart()" class="p-2 relative">
      <span class="material-symbols-outlined text-2xl">shopping_bag</span>
      <span id="cart-count-desktop" class="absolute top-0 right-0 bg-primary text-black text-[10px] w-4 h-4 rounded-full hidden items-center justify-center font-bold">0</span>
    </button>
  </header>

  <main class="pt-24 md:pt-32 px-4 max-w-7xl mx-auto">
    <!-- Featured Promo -->
    <section class="mb-10 gs-fade-up opacity-0 translate-y-[20px]">
      <div class="glass rounded-3xl p-6 relative overflow-hidden flex items-center justify-between group">
        <div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent z-0"></div>
        <div class="absolute -right-10 -bottom-10 w-48 h-48 bg-primary/20 rounded-full blur-[60px] group-hover:bg-primary/30 transition-colors duration-700"></div>
        <div class="relative z-10 max-w-xl">
          <span class="text-primary text-[10px] uppercase tracking-widest font-mono mb-2 block">Premium Roast</span>
          <h1 class="font-display text-4xl md:text-6xl font-bold leading-tight mb-4 text-white">The Danki<br><span class="text-primary italic">Blend.</span></h1>
          <button onclick="document.getElementById('shop').scrollIntoView()" class="bg-primary text-black font-bold py-3 px-6 rounded-full inline-flex items-center gap-2 hover:opacity-90 transition">
            Explore Now <span class="material-symbols-outlined text-sm">arrow_forward</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Categories -->
    <section class="mb-8 overflow-x-auto hide-scrollbar -mx-4 px-4">
      <div class="flex gap-3 w-max">
        <button onclick="setCategory('All')" id="cat-All" class="cat-btn glass rounded-full px-6 py-2.5 text-sm bg-primary text-black">All</button>
        <button onclick="setCategory('Beans')" id="cat-Beans" class="cat-btn glass rounded-full px-6 py-2.5 text-sm text-on-surface-variant">Beans</button>
        <button onclick="setCategory('Ground')" id="cat-Ground" class="cat-btn glass rounded-full px-6 py-2.5 text-sm text-on-surface-variant">Ground</button>
        <button onclick="setCategory('250g')" id="cat-250g" class="cat-btn glass rounded-full px-6 py-2.5 text-sm text-on-surface-variant">250g</button>
      </div>
    </section>

    <!-- Product Grid -->
    <section id="shop">
      <!-- App Header -->
      <header class="flex justify-between items-center mb-6 pt-4 relative z-10 gs-fade-down opacity-0 translate-y-[-20px]">
        <h2 class="font-display text-2xl font-bold">Discover Brews</h2>
      </header>
      <div id="product-grid" class="grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-6">
        <!-- Injected via JS -->
      </div>
    </section>
  </main>

  <!-- Bottom Nav (Mobile) -->
  <nav aria-label="Bottom Navigation" class="md:hidden fixed bottom-6 inset-x-6 bg-black/60 backdrop-blur-xl border border-white/10 rounded-[2.5rem] z-40 px-6 py-3 flex justify-between items-center shadow-[0_16px_40px_rgba(0,0,0,0.6)]">
    <button aria-label="Home" class="flex flex-col items-center text-[#A09D98] hover:text-white transition-colors duration-300">
      <span class="material-symbols-outlined text-[24px] mb-0.5">home</span>
      <span class="text-[9px] font-medium tracking-wide">Home</span>
    </button>
    <button aria-label="Shop" onclick="openCart()" class="relative flex flex-col items-center text-[#E6AC00] drop-shadow-[0_0_12px_rgba(230,172,0,0.6)] transition-all duration-300 transform scale-105">
      <span class="material-symbols-outlined text-[24px] mb-0.5" style="font-variation-settings: 'FILL' 1;">shopping_bag</span>
      <span class="text-[9px] font-bold tracking-wide">Shop</span>
      <span id="cart-count" class="absolute -top-1 -right-2 bg-[#E6AC00] text-black text-[9px] w-[16px] h-[16px] rounded-full hidden items-center justify-center font-bold shadow-lg">0</span>
    </button>
    <button aria-label="Beans" class="flex flex-col items-center text-[#A09D98] hover:text-white transition-colors duration-300">
      <span class="material-symbols-outlined text-[24px] mb-0.5">local_cafe</span>
      <span class="text-[9px] font-medium tracking-wide">Beans</span>
    </button>
    <button aria-label="Profile" class="flex flex-col items-center text-[#A09D98] hover:text-white transition-colors duration-300">
      <span class="material-symbols-outlined text-[24px] mb-0.5">person</span>
      <span class="text-[9px] font-medium tracking-wide">Profile</span>
    </button>
  </nav>

  <!-- Cart Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-md items-end md:items-center justify-center">
    <div class="glass-strong w-full md:max-w-md rounded-t-[32px] md:rounded-[32px] p-6 h-[80vh] md:h-auto flex flex-col">
      <div class="flex justify-between items-center mb-6">
        <h2 class="font-display text-xl font-bold">Your Cart</h2>
        <button onclick="closeCart()" class="p-2"><span class="material-symbols-outlined">close</span></button>
      </div>
      <div id="cart-items" class="flex-1 overflow-y-auto space-y-4 mb-6"></div>
      <div class="border-t border-white/10 pt-4">
        <div class="flex justify-between font-bold mb-4">
          <span>Total</span>
          <span id="cart-total" class="text-primary">0 TZS</span>
        </div>
        <button class="w-full bg-primary text-black font-bold rounded-full py-4">Checkout via WhatsApp</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    let PRODUCTS = [];
    let cart = [];
    let currentCategory = 'All';

    // GSAP Setup
    function initAnimations() {
      gsap.to('.gs-fade-down', { y: 0, opacity: 1, duration: 1, stagger: 0.1, ease: 'power3.out', delay: 0.2 });
      gsap.to('.gs-fade-up', { y: 0, opacity: 1, duration: 1, ease: 'power3.out', delay: 0.4 });
      
      // Animate bottom nav
      gsap.fromTo('nav[aria-label="Bottom Navigation"]', 
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 1, ease: 'power3.out', delay: 0.6 }
      );
    }

    function animateProducts() {
      gsap.to('.product-card', {
        y: 0,
        opacity: 1,
        duration: 0.8,
        stagger: 0.1,
        ease: 'power3.out',
        overwrite: 'auto'
      });
    }

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        if (res.ok) {
          PRODUCTS = await res.json();
          renderProducts();
          initAnimations(); 
        }
      } catch (err) {
        console.error("Failed to load products", err);
      }
    }

    function renderProducts() {
      const grid = document.getElementById('product-grid');
      const filtered = PRODUCTS.filter(p => 
        currentCategory === 'All' || 
        p.format === currentCategory || 
        p.weight === currentCategory
      );
      
      grid.innerHTML = filtered.map(p => {
        let defaultImg = '/images/danki_photo_full.jpg';
        
        if (p.weight === '250g') {
           if (p.category === 'Dark Roast') defaultImg = p.format === 'Ground' ? '/images/bag_dark_ground_250g.jpg' : '/images/bag_dark_beans_250g.jpg';
           else defaultImg = p.format === 'Ground' ? '/images/bag_med_dark_ground_250g.jpg' : '/images/bag_med_dark_beans_250g.jpg';
        } else if (p.weight === '1kg' || p.weight === '500g') {
           let roastStr = 'medium';
           if (p.category === 'Dark Roast') roastStr = 'dark';
           else if (p.category === 'Medium to Dark Roast' || p.category === 'Medium to Dark') roastStr = 'medium-dark';
           let formatStr = p.format.toLowerCase();
           defaultImg = '/images/bag_' + roastStr + '_' + formatStr + '_' + p.weight + '.jpg';
        }
        
        const imgPath = p.img || defaultImg;

        return `
        <div class="glass product-card rounded-3xl p-3 flex flex-col relative group opacity-0 translate-y-[30px]">
          <div class="absolute top-4 left-4 z-10 glass px-2 py-1 rounded-full text-[9px] uppercase tracking-wider font-bold">★ 4.9</div>
          <div class="overflow-hidden rounded-2xl mb-3 bg-black/40"><img src="${imgPath}" class="product-img w-full" alt="${p.name}"></div>
          <div class="px-2 pb-2 flex-1 flex flex-col">
            <h3 class="font-display font-bold text-base leading-tight mb-1">${p.name}</h3>
            <p class="text-xs text-on-surface-variant mb-3 flex-1">${p.format} · ${p.weight}</p>
            <div class="flex justify-between items-center mt-auto">
              <span class="font-mono text-primary font-bold text-sm">${p.price.toLocaleString()} TZS</span>
              <button onclick="addToCart('${p.id}')" class="bg-white/10 hover:bg-primary hover:text-black rounded-full w-8 h-8 flex items-center justify-center transition">
                <span class="material-symbols-outlined text-sm">add</span>
              </button>
            </div>
          </div>
        </div>
      `}).join('');
      
      setTimeout(animateProducts, 50);
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.remove('bg-primary', 'text-black');
        btn.classList.add('glass', 'text-on-surface-variant');
      });
      const activeBtn = document.getElementById('cat-' + cat);
      if(activeBtn) {
        activeBtn.classList.remove('glass', 'text-on-surface-variant');
        activeBtn.classList.add('bg-primary', 'text-black');
      }
      
      gsap.to('.product-card', { 
        y: 20, opacity: 0, duration: 0.3, stagger: 0.05, 
        onComplete: renderProducts 
      });
    }

    function addToCart(id) {
      const p = PRODUCTS.find(x => x.id === id);
      const e = cart.find(x => x.id === id);
      e ? e.qty++ : cart.push({...p, qty: 1});
      updateCart();
    }

    function updateCart() {
      const q = cart.reduce((s, x) => s + x.qty, 0);
      document.getElementById('cart-count').textContent = q;
      document.getElementById('cart-count-desktop').textContent = q;
      document.getElementById('cart-count').style.display = q ? 'flex' : 'none';
      document.getElementById('cart-count-desktop').style.display = q ? 'flex' : 'none';
      
      const total = cart.reduce((s, x) => s + x.price * x.qty, 0);
      document.getElementById('cart-total').textContent = total.toLocaleString() + ' TZS';
      
      document.getElementById('cart-items').innerHTML = cart.map(x => `
        <div class="glass rounded-2xl p-3 flex items-center gap-4">
          <div class="flex-1">
            <h4 class="font-bold text-sm">${x.name}</h4>
            <p class="text-xs text-on-surface-variant">${x.format} · ${x.weight}</p>
          </div>
          <div class="font-mono text-primary text-sm">${(x.price * x.qty).toLocaleString()}</div>
        </div>
      `).join('');
    }

    function openCart() { document.getElementById('cart-modal').classList.replace('hidden', 'flex'); }
    function closeCart() { document.getElementById('cart-modal').classList.replace('flex', 'hidden'); }

    loadProducts();
    updateCart();
  </script>
  
  <!-- GSAP for Smooth Animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</body>
</html>
