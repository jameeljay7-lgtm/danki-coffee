<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Danki Coffee — Premium Arabica Storefront</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            coffeeGold: '#d4a359',
            coffeeGoldLight: '#f3c98b',
            espressoDark: '#0a0806',
            glassBg: 'rgba(255, 255, 255, 0.05)',
            glassBorder: 'rgba(255, 255, 255, 0.1)'
          },
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090705;
      color: #f5f0eb;
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      padding-bottom: 100px;
    }

    /* ===== LIQUID ESPRESSO BACKGROUND ===== */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: 
        radial-gradient(circle at 50% 20%, rgba(180, 100, 30, 0.25) 0%, transparent 60%),
        radial-gradient(circle at 80% 70%, rgba(130, 60, 10, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 10% 90%, rgba(90, 40, 5, 0.3) 0%, transparent 60%),
        url('/images/mockup.jpg') no-repeat center center / cover;
      background-blend-mode: overlay;
      opacity: 0.85;
      filter: saturate(1.2) contrast(1.1);
    }
    
    .liquid-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(180deg, rgba(9, 7, 5, 0.75) 0%, rgba(9, 7, 5, 0.88) 50%, rgba(9, 7, 5, 0.96) 100%);
    }

    /* ===== LIQUID GLASS CARDS ===== */
    .glass-card {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    
    .glass-card:hover {
      transform: translateY(-6px) scale(1.01);
      border-color: rgba(212, 163, 89, 0.4);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(212, 163, 89, 0.15);
    }

    .glass-nav {
      background: rgba(18, 14, 10, 0.75);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
      border-radius: 100px;
    }

    .btn-gold {
      background: linear-gradient(135deg, #d4a359 0%, #b88338 100%);
      color: #0a0806;
      font-weight: 700;
      box-shadow: 0 10px 25px rgba(212, 163, 89, 0.3);
      transition: all 0.3s ease;
    }
    .btn-gold:hover {
      transform: scale(1.04);
      box-shadow: 0 15px 35px rgba(212, 163, 89, 0.5);
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #090705; }
    ::-webkit-scrollbar-thumb { background: #2a2016; border-radius: 3px; }
  </style>
</head>
<body class="selection:bg-coffeeGold selection:text-black">

  <!-- BACKGROUND ART -->
  <div class="liquid-bg"></div>
  <div class="liquid-overlay"></div>

  <!-- CONTAINER -->
  <div class="max-w-md mx-auto px-4 pt-6 pb-24 space-y-6">

    <!-- TOP HEADER BAR -->
    <header class="flex items-center justify-between py-2">
      <div>
        <h1 class="text-2xl font-bold font-display tracking-tight text-white flex items-center gap-1.5">
          <span>Danki</span>
          <span class="text-coffeeGold">Coffee</span>
        </h1>
        <p class="text-xs text-amber-200/60 font-medium">Highland Tanzanian Arabica</p>
      </div>

      <div class="flex items-center space-x-3">
        <!-- Search Button -->
        <button class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-white hover:text-coffeeGold transition">
          <span class="material-symbols-outlined text-xl">search</span>
        </button>

        <!-- User Profile Avatar -->
        <button class="w-10 h-10 rounded-full glass-card flex items-center justify-center text-coffeeGold overflow-hidden border border-coffeeGold/30">
          <span class="material-symbols-outlined text-xl">person</span>
        </button>

        <!-- Cart Trigger -->
        <button onclick="openCart()" class="relative w-10 h-10 rounded-full glass-card flex items-center justify-center text-white hover:text-coffeeGold transition">
          <span class="material-symbols-outlined text-xl">shopping_bag</span>
          <span id="cartBadge" class="absolute -top-1 -right-1 bg-coffeeGold text-black font-bold text-[10px] w-5 h-5 rounded-full flex items-center justify-center hidden">0</span>
        </button>
      </div>
    </header>

    <!-- FEATURED HERO BANNER (THE DANKI BLEND) -->
    <section class="glass-card p-5 relative overflow-hidden flex items-center justify-between min-h-[170px]">
      <!-- Background Ambient Glow -->
      <div class="absolute -right-10 -top-10 w-44 h-44 bg-coffeeGold/20 rounded-full filter blur-3xl pointer-events-none"></div>

      <div class="space-y-3 z-10 max-w-[55%]">
        <span class="text-[11px] font-bold text-coffeeGold tracking-widest uppercase">Feature</span>
        <h2 class="text-xl font-extrabold text-white leading-tight font-display">
          The Danki<br>Blend
        </h2>
        <button onclick="scrollToShop()" class="btn-gold text-xs px-4 py-2 rounded-full inline-flex items-center space-x-1">
          <span>Explore Now</span>
        </button>
      </div>

      <!-- Hero Product Image -->
      <div class="z-10 relative">
        <img src="/images/bag_dark_beans_1kg.jpg" alt="The Danki Blend" class="w-28 h-36 object-contain drop-shadow-2xl hover:scale-105 transition-transform duration-500">
      </div>
    </section>

    <!-- CATEGORY FILTER PILLS -->
    <section class="flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-none">
      <button onclick="filterCategory('All')" class="cat-pill active px-4 py-2 rounded-full text-xs font-semibold bg-coffeeGold text-black transition shrink-0">All Roast</button>
      <button onclick="filterCategory('Dark Roast')" class="cat-pill px-4 py-2 rounded-full text-xs font-semibold glass-card text-white hover:text-coffeeGold transition shrink-0">Dark Roast</button>
      <button onclick="filterCategory('Medium Roast')" class="cat-pill px-4 py-2 rounded-full text-xs font-semibold glass-card text-white hover:text-coffeeGold transition shrink-0">Medium Roast</button>
      <button onclick="filterCategory('Equipment')" class="cat-pill px-4 py-2 rounded-full text-xs font-semibold glass-card text-white hover:text-coffeeGold transition shrink-0">Equipment</button>
    </section>

    <!-- DISCOVER OUR BREWS (PRODUCT GRID) -->
    <section class="space-y-4" id="shop">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold text-white font-display">Discover Our Brews</h3>
        <span class="text-xs text-coffeeGold font-medium">Grade AA Arabica</span>
      </div>

      <!-- Products Grid -->
      <div id="productGrid" class="grid grid-cols-2 gap-4">
        <!-- Rendered dynamically by JS -->
      </div>
    </section>

  </div>

  <!-- FLOATING GLASS BOTTOM NAVIGATION BAR -->
  <nav class="fixed bottom-4 left-1/2 -translate-x-1/2 glass-nav px-6 py-3 flex items-center space-x-8 z-50 shadow-2xl">
    <button class="flex flex-col items-center space-y-0.5 text-coffeeGold">
      <span class="material-symbols-outlined text-2xl">home</span>
      <span class="text-[10px] font-bold tracking-wide">Home</span>
    </button>
    <button onclick="scrollToShop()" class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-white transition">
      <span class="material-symbols-outlined text-2xl">storefront</span>
      <span class="text-[10px] font-semibold tracking-wide">Shop</span>
    </button>
    <button class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-white transition">
      <span class="material-symbols-outlined text-2xl">coffee_maker</span>
      <span class="text-[10px] font-semibold tracking-wide">Beans</span>
    </button>
    <button class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-white transition">
      <span class="material-symbols-outlined text-2xl">article</span>
      <span class="text-[10px] font-semibold tracking-wide">Blog</span>
    </button>
    <button class="flex flex-col items-center space-y-0.5 text-gray-400 hover:text-white transition">
      <span class="material-symbols-outlined text-2xl">person</span>
      <span class="text-[10px] font-semibold tracking-wide">Profile</span>
    </button>
  </nav>

  <!-- CART DRAWER MODAL -->
  <div id="cartModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex justify-end">
    <div class="w-full max-w-md bg-[#0e0a07] h-full p-6 flex flex-col justify-between border-l border-white/10 overflow-y-auto">
      <div>
        <div class="flex items-center justify-between pb-4 border-b border-white/10">
          <h3 class="text-xl font-bold font-display text-white">Your Cart</h3>
          <button onclick="closeCart()" class="text-gray-400 hover:text-white">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <div id="cartItems" class="py-4 space-y-3">
          <div class="text-sm text-gray-400 italic">Your cart is empty.</div>
        </div>
      </div>

      <div class="space-y-4 pt-4 border-t border-white/10">
        <div class="flex justify-between text-sm font-semibold">
          <span class="text-gray-400">Total Amount</span>
          <span id="cartTotal" class="text-coffeeGold font-bold">TZS 0</span>
        </div>
        <button onclick="alert('Order placed successfully! Thank you for choosing Danki Coffee.')" class="w-full btn-gold py-3.5 rounded-full text-center text-sm font-bold">
          Checkout Securely
        </button>
      </div>
    </div>
  </div>

  <!-- DYNAMIC JS LOGIC -->
  <script>
    let cart = [];
    let allProducts = [];

    async function loadProducts() {
      try {
        const res = await fetch('/api/products');
        allProducts = await res.json();
        renderGrid(allProducts);
      } catch(err) {
        console.error('Failed loading products:', err);
      }
    }

    function renderGrid(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      products.forEach(p => {
        const rating = (4.7 + (Math.random() * 0.2)).toFixed(1);
        const card = document.createElement('div');
        card.className = 'glass-card p-4 flex flex-col justify-between space-y-3 relative group';

        const imgSrc = p.img || '/images/bag_dark_beans_1kg.jpg';
        const formattedPrice = `TZS ${(p.price).toLocaleString()}`;

        card.innerHTML = `
          <div class="relative flex justify-center py-2">
            <span class="absolute top-0 right-0 text-[10px] font-bold text-coffeeGold flex items-center bg-black/40 px-2 py-0.5 rounded-full backdrop-blur-sm border border-coffeeGold/20">
              ★ ${rating}
            </span>
            <img src="${imgSrc}" alt="${p.name}" class="h-28 object-contain drop-shadow-xl group-hover:scale-105 transition duration-300">
          </div>

          <div>
            <h4 class="text-xs font-bold text-white line-clamp-1 font-display uppercase tracking-wide">${p.name}</h4>
            <p class="text-[10px] text-amber-200/60 font-medium">${p.weight}</p>
          </div>

          <div class="flex items-center justify-between pt-1">
            <span class="text-xs font-extrabold text-coffeeGold font-mono">${formattedPrice}</span>
            <button onclick="addToCart('${p.id}')" class="w-7 h-7 rounded-lg btn-gold flex items-center justify-center shadow-lg active:scale-95 transition">
              <span class="material-symbols-outlined text-sm font-bold">add</span>
            </button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterCategory(cat) {
      document.querySelectorAll('.cat-pill').forEach(el => {
        el.classList.remove('bg-coffeeGold', 'text-black');
        el.classList.add('glass-card', 'text-white');
      });
      event.target.classList.remove('glass-card', 'text-white');
      event.target.classList.add('bg-coffeeGold', 'text-black');

      if (cat === 'All') {
        renderGrid(allProducts);
      } else {
        const filtered = allProducts.filter(p => p.category === cat);
        renderGrid(filtered);
      }
    }

    function addToCart(id) {
      const prod = allProducts.find(p => p.id === id);
      if (!prod) return;
      const existing = cart.find(i => i.id === id);
      if (existing) {
        existing.qty++;
      } else {
        cart.push({ ...prod, qty: 1 });
      }
      updateCartUI();
      openCart();
    }

    function updateCartUI() {
      const badge = document.getElementById('cartBadge');
      const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
      if (totalQty > 0) {
        badge.textContent = totalQty;
        badge.classList.remove('hidden');
      } else {
        badge.classList.add('hidden');
      }

      const container = document.getElementById('cartItems');
      const totalEl = document.getElementById('cartTotal');
      let totalPrice = 0;

      if (cart.length === 0) {
        container.innerHTML = '<div class="text-sm text-gray-400 italic">Your cart is empty.</div>';
        totalEl.textContent = 'TZS 0';
        return;
      }

      container.innerHTML = '';
      cart.forEach(item => {
        totalPrice += item.price * item.qty;
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between bg-white/5 p-3 rounded-xl border border-white/10';
        div.innerHTML = `
          <div>
            <div class="text-xs font-bold text-white">${item.name}</div>
            <div class="text-[10px] text-coffeeGold">TZS ${item.price.toLocaleString()} x ${item.qty}</div>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="changeQty('${item.id}', -1)" class="w-6 h-6 rounded bg-white/10 text-white font-bold text-xs flex items-center justify-center">-</button>
            <span class="text-xs text-white">${item.qty}</span>
            <button onclick="changeQty('${item.id}', 1)" class="w-6 h-6 rounded bg-white/10 text-white font-bold text-xs flex items-center justify-center">+</button>
          </div>
        `;
        container.appendChild(div);
      });

      totalEl.textContent = `TZS ${totalPrice.toLocaleString()}`;
    }

    function changeQty(id, delta) {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(i => i.id !== id);
      }
      updateCartUI();
    }

    function openCart() {
      document.getElementById('cartModal').classList.remove('hidden');
    }

    function closeCart() {
      document.getElementById('cartModal').classList.add('hidden');
    }

    function scrollToShop() {
      document.getElementById('shop').scrollIntoView({ behavior: 'smooth' });
    }

    loadProducts();
  </script>
</body>
</html>
